name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - name: Test mounting an isolated temporary disk image
        if: runner.os == 'Linux'
        run: ORCHARD_TEST_MOUNT=1 go test -v ./internal/volumes -run TestMountLoopbackIntegration
      - run: go vet ./...
      - run: go build -o bin/orchard ./cmd/orchard
      - run: ./bin/orchard --scan internal
      - run: test -z "$(gofmt -l cmd internal)"
      - run: python3 scripts/test_installer.py
      - run: python3 scripts/test_tui.py
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: scripts/build-release.sh ci
      - name: Install ARM emulators
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Test Raspberry Pi release binaries
        run: python3 scripts/test_arm.py dist
      - uses: actions/upload-artifact@v7
        with:
          name: orchard-binaries
          path: dist/
