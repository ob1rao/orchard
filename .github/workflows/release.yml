name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -race ./...
      - run: go vet ./...
      - run: scripts/build-release.sh "$GITHUB_REF_NAME"
      - name: Install ARM emulators
        run: sudo apt-get update && sudo apt-get install -y qemu-user
      - name: Test Raspberry Pi release binaries
        run: python3 scripts/test_arm.py dist
      - name: Publish binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "orchard $GITHUB_REF_NAME"
